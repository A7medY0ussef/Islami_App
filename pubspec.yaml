name: islami
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/
    - assets/Suras/
    - assets/hadeeth/

  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/Janna LT Bold.ttf
          weight: 700

    - family: Kamali
      fonts:
        - asset: assets/fonts/KamaliRegular-pg81r.ttf
        - asset: assets/fonts/KamaliRegular-xR725.otf